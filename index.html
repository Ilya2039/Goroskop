<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Таро Анимация</title>
  <link href="https://fonts.googleapis.com/css2?family=Rochester&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background: black;
      font-family: 'Lato', sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      color: gold;
      text-align: center;
      margin: 30px 0;
    }

    .scenario-selector {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin: 30px 0;
      width: 100%;
      max-width: 500px;
    }

    .scenario-btn {
      padding: 15px 30px;
      border: 2px solid gold;
      border-radius: 25px;
      background: transparent;
      color: gold;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.4s;
    }

    .scenario-btn:hover, .selected-scenario {
      background: gold;
      color: black;
      border-color: white;
    }

    .tarot-container {
      display: none;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 20px;
    }

    .card {
      width: 80px;
      height: 120px;
      cursor: pointer;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 8px;
    }

    .card-front {
      background: url('images/Тарообложка.jpg') no-repeat center center;
      background-size: cover;
    }

    .card-back {
      transform: rotateY(180deg);
      background-size: cover;
    }

    .viewer {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 90%;
      max-width: 400px;
    }

    .card-title {
      font-family: 'Rochester', cursive;
      color: gold;
      font-size: 26px;
      margin: 10px 0;
      text-align: center;
    }

    .viewer img {
      width: 250px;
      height: 400px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
      margin: 10px 0;
    }

    .card-description {
      color: white;
      font-size: 14px;
      line-height: 1.5;
      padding: 15px;
      margin: 10px 0;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      max-height: 200px;
      overflow-y: auto;
      width: 100%;
    }

    .buttons {
      display: flex;
      gap: 20px;
      margin-top: 15px;
    }

    button {
      padding: 10px 25px;
      border: none;
      border-radius: 5px;
      background: gold;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    #summaryResult {
      color: gold;
      margin-top: 20px;
      text-align: center;
    }

  </style>
</head>
<body>
  <div class="scenario-selector" id="scenarioSelector">
    <h1>Выберите расклад</h1>
    <button class="scenario-btn" data-scenario="love">❤️ Отношения</button>
    <button class="scenario-btn" data-scenario="health">🏥 Здоровье</button>
    <button class="scenario-btn" data-scenario="money">💰 Финансы</button>
  </div>

  <h1 id="scenarioTitle" style="display: none;"></h1>
  <h2 id="instruction" style="display: none;">Выберите 3 карты</h2>
  <div class="tarot-container" id="tarotContainer"></div>
  
  <div class="viewer" id="viewer">
    <h2 class="card-title" id="cardTitle"></h2>
    <img id="cardImage" src="" alt="Таро карта" />
    <div class="card-description" id="cardDescription"></div>
    <div class="buttons">
      <button id="prev">Назад</button>
      <button id="next">Вперед</button>
    </div>
    <button id="summarizeBtn" style="margin-top: 15px;">Подвести итог</button>
    <div id="summaryResult"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
