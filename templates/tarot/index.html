<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Таро Анимация</title>
  <link href="https://fonts.googleapis.com/css2?family=Rochester&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background: black;
      font-family: 'Lato', sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      color: gold;
      text-align: center;
      margin: 30px 0;
    }

    .scenario-selector {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin: 30px 0;
      width: 100%;
      max-width: 500px;
    }

    .scenario-btn {
      padding: 15px 30px;
      border: 2px solid gold;
      border-radius: 25px;
      background: transparent;
      color: gold;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.4s;
    }

    .scenario-btn:hover {
      background: gold;
      color: black;
    }

    .selected-scenario {
      background: gold;
      color: black;
      border-color: white;
    }

    .tarot-container {
      display: none;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 20px;
    }

    .card {
      width: 80px;
      height: 120px;
      cursor: pointer;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 8px;
    }

    .card-front {
      background: url('templates/tarot/Стороны кубика/Тарообложка.jpg') no-repeat center center;
      background-size: cover;
    }

    .card-back {
      transform: rotateY(180deg);
      background-size: cover;
    }

    .card-number {
      position: absolute;
      top: -10px;
      right: -10px;
      background: gold;
      color: black;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      z-index: 2;
      transform: scaleX(-1);
    }

    .viewer {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 90%;
      max-width: 400px;
    }

    .card-title {
      font-family: 'Rochester', cursive;
      color: gold;
      font-size: 26px;
      margin: 10px 0;
      text-align: center;
    }

    .viewer img {
      width: 250px;
      height: 400px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
      margin: 10px 0;
    }

    .card-description {
      color: white;
      font-size: 14px;
      line-height: 1.5;
      padding: 15px;
      margin: 10px 0;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      max-height: 200px;
      overflow-y: auto;
      width: 100%;
    }

    .buttons {
      display: flex;
      gap: 20px;
      margin-top: 15px;
    }

    button {
      padding: 10px 25px;
      border: none;
      border-radius: 5px;
      background: gold;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    #backToScenarios {
      margin-top: 40px;
      padding: 10px 25px;
      border: none;
      border-radius: 8px;
      background: gold;
      color: black;
      font-weight: bold;
      cursor: pointer;
      display: none;
      margin-bottom: 20px;
      transition: transform 0.2s;
    }

    #backToScenarios:hover {
      transform: scale(1.05);
    }

    #scenarioTitle {
      color: gold;
      font-size: 28px;
      text-align: center;
      margin: 20px 0 10px;
    }

    #instruction {
      color: gold;
      font-size: 20px;
      text-align: center;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="scenario-selector" id="scenarioSelector">
    <h1>Выберите расклад</h1>
    <button class="scenario-btn" data-scenario="love">❤️ Отношения</button>
    <button class="scenario-btn" data-scenario="health">🏥 Здоровье</button>
    <button class="scenario-btn" data-scenario="money">💰 Финансы</button>
  </div>
  
  <h1 id="scenarioTitle" style="display: none;"></h1>
  <h2 id="instruction" style="display: none;">Выберите 3 карты</h2>
  <div class="tarot-container" id="tarotContainer"></div>
  
  <div class="viewer" id="viewer">
    <h2 class="card-title" id="cardTitle"></h2>
    <img id="cardImage" src="" alt="Таро карта" />
    <div class="card-description" id="cardDescription"></div>
    <div class="buttons">
      <button id="prev">Назад</button>
      <button id="next">Вперед</button>
    </div>
    <!-- Новая кнопка для подведения итога и блок для отображения ответа от Gemini -->
    <button id="summarizeBtn" style="margin-top: 15px;">Подвести итог</button>
    <div id="summaryResult" style="color: gold; margin-top: 20px; text-align: center;"></div>
  </div>

  <button id="backToScenarios" style="display: none; margin-bottom: 20px;">🔙 Вернуться к выбору расклада</button>

  <script>
    const scenarioSelector = document.getElementById('scenarioSelector');
    const tarotContainer = document.getElementById('tarotContainer');
    const viewer = document.getElementById('viewer');
    const cardImage = document.getElementById('cardImage');
    const cardTitle = document.getElementById('cardTitle');
    const cardDescription = document.getElementById('cardDescription');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const instruction = document.getElementById('instruction');
    const summarizeBtn = document.getElementById('summarizeBtn');
    const summaryResult = document.getElementById('summaryResult');
    
    const scenarios = {
      love: {
        title: "Расклад на отношения",
        positions: ["Прошлое", "Текущая ситуация", "Будущее"]
      },
      health: {
        title: "Расклад на здоровье",
        positions: ["Прошлые проблемы", "Текущее состояние", "Будущее"]
      },
      money: {
        title: "Расклад на финансы",
        positions: ["Прошлые решения", "Текущая ситуация", "Будущие перспективы"]
      }
    };

    const tarotCards = [
      {
        image: 'Таро1.jpg',
        title: 'Маг',
        description: 'Аркан Маг символизирует волю, творческое начало и потенциал. Карта говорит о новых начинаниях, уверенности в себе и способности воплощать идеи в реальность.'
      },
      {
        image: 'Таро2.jpg',
        title: 'Верховная Жрица',
        description: 'Карта тайных знаний и интуиции. Указывает на необходимость прислушаться к внутреннему голосу, раскрывает скрытые возможности и тайные обстоятельства.'
      },
      {
        image: 'Таро3.jpg',
        title: 'Императрица',
        description: 'Символ плодородия, изобилия и творческой энергии. Карта говорит о процветании, новых проектах и гармонии в отношениях.'
      },
      {
        image: 'Таро4.jpg',
        title: 'Император',
        description: 'Власть, структура и стабильность. Карта указывает на необходимость принимать ответственные решения и проявлять лидерские качества.'
      },
      {
        image: 'Таро5.jpg',
        title: 'Иерофант',
        description: 'Символ традиций, духовных ценностей и моральных устоев. Карта советует следовать установленным правилам и искать мудрых наставников.'
      },
      {
        image: 'Таро6.jpg',
        title: 'Влюблённые',
        description: 'Карта любви, гармонии и важного выбора. Говорит о необходимости принимать решения сердцем и искать баланс между чувствами и разумом.'
      },
      {
        image: 'Таро7.jpg',
        title: 'Колесница',
        description: 'Символ движения, победы и контроля. Карта призывает к активным действиям, дисциплине и концентрации на цели.'
      },
      {
        image: 'Таро8.jpg',
        title: 'Сила',
        description: 'Внутренняя сила, смелость и сострадание. Карта говорит о необходимости проявлять мягкую силу и контролировать свои эмоции.'
      }
    ];

    const descriptionsMap = new Map();
    tarotCards.forEach(card => descriptionsMap.set(card.image, card));

    let selectedScenario = null;
    let selectedCards = [];
    let currentIndex = 0;

    const backToScenariosBtn = document.getElementById('backToScenarios');

    // Логика для кнопки возврата к выбору сценария
    backToScenariosBtn.addEventListener('click', () => {
      scenarioSelector.style.display = 'flex';
      scenarioTitle.style.display = 'none';
      instruction.style.display = 'none';
      tarotContainer.style.display = 'none';
      viewer.style.display = 'none';
      backToScenariosBtn.style.display = 'none';
      summaryResult.textContent = '';
    });

    // Обработчики сценариев
    document.querySelectorAll('.scenario-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedScenario = btn.dataset.scenario;
        scenarioSelector.style.display = 'none';
        backToScenariosBtn.style.display = 'block';

        // Показываем заголовок с названием расклада
        scenarioTitle.textContent = scenarios[selectedScenario].title;
        scenarioTitle.style.display = 'block';

        // Показываем инструкцию "Выберите 3 карты"
        instruction.textContent = 'Выберите 3 карты';
        instruction.style.display = 'block';

        tarotContainer.style.display = 'flex';
        selectedCards = [];
        summaryResult.textContent = '';
        resetCards();
      });
    });

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function createCards() {
      tarotContainer.innerHTML = '';
      const shuffledCards = shuffle([...tarotCards]);
      shuffledCards.forEach(card => {
        const cardElement = document.createElement('div');
        cardElement.classList.add('card');
        cardElement.innerHTML = `
          <div class="card-front"></div>
          <div class="card-back" 
               style="background-image: url('templates/tarot/Стороны кубика/${card.image}')">
          </div>`;
        cardElement.addEventListener('click', () => flipCard(cardElement, card.image));
        tarotContainer.appendChild(cardElement);
      });
    }

    function resetCards() {
      selectedCards = [];
      document.querySelectorAll('.card').forEach(card => {
        card.classList.remove('flipped');
        const number = card.querySelector('.card-number');
        if (number) number.remove();
      });
      createCards();
    }

    function flipCard(cardElement, cardImage) {
      if (selectedCards.length >= 3 && !cardElement.classList.contains('flipped')) return;
      
      if (cardElement.classList.contains('flipped')) {
        const index = selectedCards.findIndex(c => c.image === cardImage);
        selectedCards.splice(index, 1);
        cardElement.classList.remove('flipped');
      } else {
        const cardData = descriptionsMap.get(cardImage);
        selectedCards.push(cardData);
        cardElement.classList.add('flipped');
      }
      
      updateCardNumbers();
      
      if (selectedCards.length === 3) {
        setTimeout(() => {
          instruction.style.display = 'none';
          tarotContainer.style.display = 'none';
          viewer.style.display = 'flex';
          showCard(0);
        }, 1000);
      }
    }

    function updateCardNumbers() {
      document.querySelectorAll('.card').forEach(card => {
        const numberDiv = card.querySelector('.card-number');
        if (numberDiv) numberDiv.remove();
        
        if (card.classList.contains('flipped')) {
          const cardImage = card.querySelector('.card-back').style.backgroundImage.match(/Таро\d+/)[0] + '.jpg';
          const position = selectedCards.findIndex(c => c.image === cardImage) + 1;
          if (position > 0) {
            const number = document.createElement('div');
            number.className = 'card-number';
            number.textContent = position;
            card.appendChild(number);
          }
        }
      });
    }

    function showCard(index) {
      currentIndex = index;
      const cardData = selectedCards[index];
      cardImage.src = `templates/tarot/Стороны кубика/${cardData.image}`;
      cardTitle.textContent = `${scenarios[selectedScenario].positions[index]}: ${cardData.title}`;
      cardDescription.textContent = cardData.description;
      updateButtons();
    }

    function updateButtons() {
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === selectedCards.length - 1;
    }

    prevBtn.addEventListener('click', () => {
      if (currentIndex > 0) showCard(currentIndex - 1);
    });

    nextBtn.addEventListener('click', () => {
      if (currentIndex < selectedCards.length - 1) showCard(currentIndex + 1);
    });

    // Функция формирования запроса для Gemini на основе выбранных карт
    function getSummary() {
      let query = scenarios[selectedScenario].title + ":\n\n";
      for (let i = 0; i < selectedCards.length; i++) {
         query += scenarios[selectedScenario].positions[i] + " — " + selectedCards[i].title + ":\n" + selectedCards[i].description + "\n\n";
      }
      query += "Подведите итог расклада, объясните значение каждой карты и общий вывод.";
      return query;
    }

    // Обработчик кнопки "Подвести итог"
    summarizeBtn.addEventListener('click', () => {
      const query = getSummary();
      summaryResult.textContent = "Обработка запроса…";
      fetch('/natal/gemini', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({query: query})
      })
      .then(response => response.json())
      .then(data => {
          if (data.answer) {
              summaryResult.textContent = data.answer;
          } else {
              summaryResult.textContent = "Ошибка: не получен ответ от Gemini";
          }
      })
      .catch(error => {
          console.error('Ошибка:', error);
          summaryResult.textContent = "Ошибка запроса к Gemini";
      });
    });

    // Инициализация
    createCards();
    scenarioSelector.style.display = 'flex';
    tarotContainer.style.display = 'none';
    viewer.style.display = 'none';
  </script>
</body>
</html>
